<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodi Messenger Remote</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        header { background-color: #1f1f1f; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2c2c2c; }
        .bot-profile { display: flex; align-items: center; gap: 10px; }
        .bot-avatar { width: 36px; height: 36px; background-color: #2e7d32; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; }
        .bot-info h1 { font-size: 15px; font-weight: 600; color: #fff; }
        .bot-info p { font-size: 11px; color: #4caf50; }
        .settings-btn { background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer; padding: 4px; }
        .settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; border: 1px solid #333; }
        .modal-content h2 { font-size: 16px; margin-bottom: 12px; color: #fff; }
        .modal-content input { width: 100%; padding: 10px; background: #121212; border: 1px solid #444; color: #fff; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .modal-content button { width: 100%; padding: 10px; background: #4caf50; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #005c4b; color: #e9edef; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot-message { background: #202c33; color: #e9edef; align-self: flex-start; border-bottom-left-radius: 4px; }
        .system-message { background: #182229; color: #8696a0; align-self: center; font-size: 12px; border-radius: 8px; text-align: center; max-width: 95%; }
        .error-message { background: #5c0000; color: #ff8080; align-self: center; font-size: 12px; border-radius: 8px; text-align: center; max-width: 95%; }
        .quick-actions { padding: 8px 12px; display: flex; gap: 8px; overflow-x: auto; background: #161616; border-top: 1px solid #222; }
        .quick-action-btn { background: #262626; border: 1px solid #333; color: #ccc; padding: 6px 12px; border-radius: 16px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .quick-action-btn:active { background: #333; }
        .input-bar { padding: 10px 12px; background: #1f1f1f; display: flex; align-items: center; gap: 8px; border-top: 1px solid #2c2c2c; }
        .input-bar input { flex: 1; background: #2a2a2a; border: none; padding: 10px 14px; border-radius: 20px; color: #fff; font-size: 14px; outline: none; }
        .send-btn { background: #00a884; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; flex-shrink: 0; }
        .send-btn:active { background: #008f72; }
    </style>
</head>
<body>

    <header>
        <div class="bot-profile">
            <div class="bot-avatar">📺</div>
            <div class="bot-info">
                <h1>Kodi Agent</h1>
                <p>Online & Ready</p>
            </div>
        </div>
        <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    </header>

    <div id="settingsModal" class="settings-modal">
        <div class="modal-content">
            <h2>Gemini API Settings</h2>
            <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key">
            <button onclick="saveApiKey()">Save Key</button>
        </div>
    </div>

    <div id="chat-container">
        <div class="message bot-message">Hey Christopher! Just text me what you want to watch or control on Kodi (e.g., "Play Regular Show using Umbrella").</div>
    </div>

    <div class="quick-actions">
        <button class="quick-action-btn" onclick="sendQuickCommand('Play Regular Show using Umbrella')">📺 Play Regular Show</button>
        <button class="quick-action-btn" onclick="sendQuickCommand('What is currently playing?')">ℹ️ What's Playing?</button>
        <button class="quick-action-btn" onclick="sendQuickCommand('Toggle play pause')">⏯️ Play/Pause</button>
    </div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Message Kodi Agent..." autocomplete="off">
        <button class="send-btn" onclick="handleSendMessage()">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>

    <script>
        const KODI_IP = "192.168.4.26";
        const PORT = 8080;
        const KODI_URL = `http://${KODI_IP}:${PORT}/jsonrpc`;
        const KODI_AUTH = 'kodi:12345';

        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let conversationHistory = [];

        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            if (modal.style.display === 'flex') {
                document.getElementById('apiKeyInput').value = apiKey;
            }
        }

        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            toggleSettings();
            appendMessage("Settings successfully updated.", "system-message");
        }

        if (!apiKey) {
            appendMessage("Please open Settings and enter your Gemini API Key.", "system-message");
        }

        async function kodiRequest(method, params = {}) {
            try {
                const response = await fetch(KODI_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(KODI_AUTH)
                    },
                    body: JSON.stringify({ jsonrpc: "2.0", method: method, params: params, id: 1 })
                });
                const data = await response.json();
                return data.result;
            } catch (error) {
                return { error: error.message };
            }
        }

        const toolsImplementation = {
            get_currently_playing: async () => {
                return await kodiRequest("Player.GetItem", { playerid: 1, properties: ["title", "showtitle", "season", "episode", "duration"] });
            },
            play_pause: async () => {
                return await kodiRequest("Player.PlayPause", { playerid: 1 });
            },
            show_notification: async ({ title, message }) => {
                return await kodiRequest("GUI.ShowNotification", { title: title, message: message, displaytime: 4000 });
            },
            play_umbrella_show: async ({ query }) => {
                const params = {
                    addon: "plugin.video.umbrella",
                    params: { action: "search", q: query }
                };
                return await kodiRequest("Addons.ExecuteAddon", params);
            }
        };

        const functionDeclarations = [
            {
                name: "get_currently_playing",
                description: "Queries Kodi to see what media title, show, season, and episode are currently playing."
            },
            {
                name: "play_pause",
                description: "Toggles play or pause on the active Kodi media player."
            },
            {
                name: "show_notification",
                description: "Pushes a custom notification toast message to the Kodi TV screen.",
                parameters: {
                    type: "OBJECT",
                    properties: {
                        title: { type: "STRING", description: "The title header of the notification." },
                        message: { type: "STRING", description: "The body text of the notification message." }
                    },
                    required: ["title", "message"]
                }
            },
            {
                name: "play_umbrella_show",
                description: "Searches or launches a show using the Umbrella video add-on in Kodi.",
                parameters: {
                    type: "OBJECT",
                    properties: {
                        query: { type: "STRING", description: "The name of the TV show or movie to play via Umbrella." }
                    },
                    required: ["query"]
                }
            }
        ];

        function appendMessage(text, className) {
            const container = document.getElementById('chat-container');
            const msg = document.createElement('div');
            msg.className = `message ${className}`;
            msg.innerText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function sendQuickCommand(cmd) {
            document.getElementById('userInput').value = cmd;
            handleSendMessage();
        }

        async function handleSendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            if (!apiKey) {
                appendMessage("Please configure your Gemini API Key in Settings first.", "error-message");
                return;
            }

            appendMessage(text, "user-message");
            input.value = "";

            conversationHistory.push({ role: "user", parts: [{ text: text }] });

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;
                
                let payload = {
                    contents: conversationHistory,
                    systemInstruction: {
                        parts: [{ text: "You are a smart home execution agent for Kodi. When the user requests to play a show, movie, or media title, you MUST invoke the play_umbrella_show tool." }]
                    },
                    tools: [{ functionDeclarations: functionDeclarations }],
                    generationConfig: { temperature: 0.0 }
                };

                let response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                let data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let candidate = data.candidates[0].content;
                conversationHistory.push(candidate);

                let functionCall = candidate.parts.find(p => p.functionCall);

                if (functionCall) {
                    let call = functionCall.functionCall;
                    appendMessage(`Executing tool: ${call.name}(${JSON.stringify(call.args)})`, "system-message");

                    if (toolsImplementation[call.name]) {
                        let toolResult = await toolsImplementation[call.name](call.args);

                        conversationHistory.push({
                            role: "function",
                            parts: [{
                                functionResponse: {
                                    name: call.name,
                                    response: { result: toolResult }
                                }
                            }]
                        });

                        let followUpResponse = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: conversationHistory,
                                systemInstruction: {
                                    parts: [{ text: "You are a smart home execution agent for Kodi." }]
                                },
                                tools: [{ functionDeclarations: functionDeclarations }],
                                generationConfig: { temperature: 0.0 }
                            })
                        });

                        let followUpData = await followUpResponse.json();
                        let followUpCandidate = followUpData.candidates[0].content;
                        conversationHistory.push(followUpCandidate);

                        let replyText = followUpCandidate.parts.find(p => p.text)?.text || "Command executed successfully on Kodi.";
                        appendMessage(replyText, "bot-message");
                    } else {
                        appendMessage(`Error: Unknown tool ${call.name}`, "error-message");
                    }
                } else {
                    let replyText = candidate.parts.find(p => p.text)?.text || "";
                    appendMessage(replyText, "bot-message");
                }
            } catch (err) {
                appendMessage(`Error: ${err.message}`, "error-message");
            }
        }

        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
