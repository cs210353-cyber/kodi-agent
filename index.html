<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kodi Messenger Agent</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        street: {
                            900: '#0a0a0c',
                            800: '#121316',
                            700: '#1a1b20',
                            600: '#272932',
                            neon: '#00ff66',
                            accent: '#ff0055'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0c; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #121316; }
        ::-webkit-scrollbar-thumb { background: #272932; border-radius: 2px; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col font-sans antialiased overflow-hidden selection:bg-street-neon selection:text-black">

    <header class="border-b border-street-600 bg-street-800/90 backdrop-blur shrink-0 z-20">
        <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-9 h-9 rounded-full bg-street-700 border border-street-600 flex items-center justify-center text-street-neon shadow-lg shadow-street-neon/10">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-street-neon ring-2 ring-street-800"></span>
                </div>
                <div>
                    <h1 class="font-bold text-sm tracking-wide text-white">Kodi Agent</h1>
                    <p class="text-[10px] text-street-neon">Online & Ready</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="toggleSettingsModal()" class="w-9 h-9 rounded-full bg-street-700 hover:bg-street-600 text-gray-300 border border-street-600 flex items-center justify-center transition">
                    <i class="fa-solid fa-gear text-xs text-street-neon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto flex flex-col overflow-hidden relative">
        <!-- Message Bubbles Scroll Area -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="flex items-start gap-2.5">
                <div class="w-7 h-7 rounded-full bg-street-700 border border-street-600 shrink-0 flex items-center justify-center text-street-neon text-xs">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="bg-street-700/80 border border-street-600 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-xs text-gray-200 leading-relaxed shadow-sm">
                    Hey Christopher! Just text me what you want to watch or control on Kodi (e.g. <i>"Play Regular Show using Umbrella"</i>).
                </div>
            </div>
        </div>

        <!-- Floating Quick Suggestion Pills -->
        <div class="px-4 py-2 shrink-0 flex gap-2 overflow-x-auto no-scrollbar border-t border-street-700/40 bg-street-800/40 backdrop-blur">
            <button onclick="sendQuickMessage('Play Regular Show using Umbrella')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-street-700 hover:bg-street-600 border border-street-600 text-[11px] text-gray-300 transition">🎬 Play Regular Show</button>
            <button onclick="sendQuickMessage('What am I watching?')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-street-700 hover:bg-street-600 border border-street-600 text-[11px] text-gray-300 transition">ℹ️ Status</button>
            <button onclick="sendQuickMessage('Toggle play or pause')" class="whitespace-nowrap px-3 py-1.5 rounded-full bg-street-700 hover:bg-street-600 border border-street-600 text-[11px] text-gray-300 transition">⏯️ Play/Pause</button>
        </div>

        <!-- Messenger Input Bar Pinned to Bottom -->
        <div class="p-3 bg-street-800 border-t border-street-600 shrink-0">
            <form id="messageForm" onsubmit="handleChatSubmit(event)" class="flex items-center gap-2">
                <div class="flex-1 relative">
                    <input type="text" id="userInput" placeholder="Message Kodi Agent..." autocomplete="off"
                        class="w-full bg-street-900 border border-street-600 rounded-full px-4 py-3 text-xs text-gray-100 placeholder-gray-500 focus:outline-none focus:border-street-neon transition">
                </div>
                <button type="submit" id="sendBtn" class="w-11 h-11 rounded-full bg-street-neon hover:bg-emerald-400 text-black shrink-0 flex items-center justify-center transition shadow-md shadow-street-neon/20">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-street-800 border border-street-600 rounded-2xl p-5 max-w-sm w-full shadow-2xl">
            <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-gear text-street-neon"></i> Connection Settings
            </h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-gray-400 mb-1">Gemini API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-street-900 border border-street-600 rounded-xl px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-street-neon">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-400 mb-1">Kodi JSON-RPC URL</label>
                    <input type="text" id="kodiUrlInput" value="http://192.168.4.26:8080/jsonrpc" class="w-full bg-street-900 border border-street-600 rounded-xl px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-street-neon">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-1">Username</label>
                        <input type="text" id="kodiUserInput" value="kodi" class="w-full bg-street-900 border border-street-600 rounded-xl px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-street-neon">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-gray-400 mb-1">Password</label>
                        <input type="password" id="kodiPassInput" value="12345" class="w-full bg-street-900 border border-street-600 rounded-xl px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-street-neon">
                    </div>
                </div>
            </div>
            <div class="mt-5 flex justify-end space-x-2">
                <button onclick="toggleSettingsModal()" class="px-3 py-2 rounded-xl bg-street-700 hover:bg-street-600 text-xs text-gray-300 transition">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-xl bg-street-neon hover:bg-emerald-400 text-xs font-bold text-black transition">Save</button>
            </div>
        </div>
    </div>

    <script>
        let config = {
            apiKey: localStorage.getItem('GEMINI_API_KEY') || '',
            kodiUrl: localStorage.getItem('KODI_URL') || 'http://192.168.4.26:8080/jsonrpc',
            kodiUser: localStorage.getItem('KODI_USER') || 'kodi',
            kodiPass: localStorage.getItem('KODI_PASS') || '12345'
        };

        document.getElementById('apiKeyInput').value = config.apiKey;
        document.getElementById('kodiUrlInput').value = config.kodiUrl;
        document.getElementById('kodiUserInput').value = config.kodiUser;
        document.getElementById('kodiPassInput').value = config.kodiPass;

        function toggleSettingsModal() {
            document.getElementById('settingsModal').classList.toggle('hidden');
        }

        function saveSettings() {
            config.apiKey = document.getElementById('apiKeyInput').value.trim();
            config.kodiUrl = document.getElementById('kodiUrlInput').value.trim();
            config.kodiUser = document.getElementById('kodiUserInput').value.trim();
            config.kodiPass = document.getElementById('kodiPassInput').value.trim();

            localStorage.setItem('GEMINI_API_KEY', config.apiKey);
            localStorage.setItem('KODI_URL', config.kodiUrl);
            localStorage.setItem('KODI_USER', config.kodiUser);
            localStorage.setItem('KODI_PASS', config.kodiPass);

            toggleSettingsModal();
            appendSystemMessage("Settings successfully updated.");
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chatContainer');
            const isUser = sender === 'You';
            
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-2.5 ${isUser ? 'flex-row-reverse' : ''}`;
            
            if (!isUser) {
                wrapper.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-street-700 border border-street-600 shrink-0 flex items-center justify-center text-street-neon text-xs">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="bg-street-700/80 border border-street-600 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%] text-xs text-gray-200 leading-relaxed shadow-sm">
                        ${text}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="w-7 h-7 rounded-full bg-street-neon text-black shrink-0 flex items-center justify-center font-bold text-[10px]">
                        C
                    </div>
                    <div class="bg-street-neon text-black font-medium rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%] text-xs leading-relaxed shadow-sm">
                        ${text}
                    </div>
                `;
            }
            
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function appendSystemMessage(text) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = "text-center my-2";
            div.innerHTML = `<span class="text-[10px] bg-street-700/60 border border-street-600 text-gray-400 px-3 py-1 rounded-full">${text}</span>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendQuickMessage(text) {
            document.getElementById('userInput').value = text;
            handleChatSubmit(new Event('submit'));
        }

        async function callKodiRPC(method, params = {}) {
            const payload = { jsonrpc: "2.0", method: method, params: params, id: 1 };
            const headers = { 'Content-Type': 'application/json' };
            if (config.kodiUser && config.kodiPass) {
                headers['Authorization'] = 'Basic ' + btoa(config.kodiUser + ':' + config.kodiPass);
            }
            try {
                const response = await fetch(config.kodiUrl, { method: 'POST', headers: headers, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                return data.result;
            } catch (error) {
                return { error: error.message };
            }
        }

        // Tool Definitions
        async function get_currently_playing() {
            const res = await callKodiRPC("Player.GetItem", { playerid: 1, properties: ["title", "showtitle", "season", "episode"] });
            if (res && res.item) {
                const title = res.item.title || res.item.label || "Unknown Title";
                const show = res.item.showtitle ? `${res.item.showtitle} (S${res.item.season}E${res.item.episode})` : "Active Media";
                return `Currently playing: ${title} - ${show}`;
            }
            return "No media currently playing.";
        }

        async function play_pause() {
            const res = await callKodiRPC("Player.PlayPause", { playerid: 1 });
            return "Toggled play/pause on Kodi.";
        }

        async function show_notification(args) {
            await callKodiRPC("GUI.ShowNotification", { title: args.title || "Kodi Agent", message: args.message || "Hello!", displaytime: 4000 });
            return `Notification sent to TV: "${args.message}"`;
        }

        async function play_umbrella_show(args) {
            const query = args.query || args.q || "";
            await callKodiRPC("Addons.ExecuteAddon", { addon: "plugin.video.umbrella", params: { action: "search", q: query } });
            return `Launched Umbrella search for "${query}" on Kodi.`;
        }

        const toolDeclarations = [
            { name: "get_currently_playing", description: "Queries Kodi to see what media is currently playing.", parameters: { type: "OBJECT", properties: {} } },
            { name: "play_pause", description: "Toggles play or pause on Kodi.", parameters: { type: "OBJECT", properties: {} } },
            { name: "show_notification", description: "Pushes a notification toast to the TV.", parameters: { type: "OBJECT", properties: { title: { type: "STRING" }, message: { type: "STRING" } }, required: ["title", "message"] } },
            { name: "play_umbrella_show", description: "Searches and plays a show using the Umbrella add-on.", parameters: { type: "OBJECT", properties: { query: { type: "STRING", description: "Show or movie name" } }, required: ["query"] } }
        ];

        async function handleChatSubmit(event) {
            event.preventDefault();
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            if (!config.apiKey) {
                appendSystemMessage("Please open Settings and enter your Gemini API Key.");
                toggleSettingsModal();
                return;
            }

            inputEl.value = '';
            appendMessage('You', text);

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${config.apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: text }] }],
                tools: [{ functionDeclarations: toolDeclarations }],
                systemInstruction: { parts: [{ text: "You are a smart home chat agent for Kodi. Execute tools immediately when requested." }] }
            };

            try {
                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || `API error ${response.status}`);
                }

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.functionCall) {
                    const fc = candidate.content.parts[0].functionCall;
                    let toolResult = "";

                    if (fc.name === 'get_currently_playing') toolResult = await get_currently_playing();
                    else if (fc.name === 'play_pause') toolResult = await play_pause();
                    else if (fc.name === 'show_notification') toolResult = await show_notification(fc.args);
                    else if (fc.name === 'play_umbrella_show') toolResult = await play_umbrella_show(fc.args);

                    appendMessage('Agent', `<i class="fa-solid fa-circle-check text-street-neon mr-1"></i> ${toolResult}`);
                } else if (candidate && candidate.content?.parts?.[0]?.text) {
                    appendMessage('Agent', candidate.content.parts[0].text);
                } else {
                    appendMessage('Agent', "Done.");
                }
            } catch (err) {
                appendMessage('Agent', `<span class="text-street-accent">Error: ${err.message}</span>`);
            }
        }
    </script>
</body>
</html>
